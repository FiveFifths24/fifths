name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Format, lint, type, unit, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit and component tests
        run: npm run test
      - name: Build production application
        run: npm run build
      - name: Audit dependencies
        env:
          NPM_CONFIG_FETCH_RETRIES: 0
          NPM_CONFIG_FETCH_TIMEOUT: 60000
        run: |
          audit_with_retry() {
            local attempt=1
            local delay=5
            local max_attempts=3
            local output_file
            local status
            output_file="$(mktemp)"

            while true; do
              set +e
              npm audit "$@" 2>&1 | tee "$output_file"
              status=${PIPESTATUS[0]}
              set -e

              if [ "$status" -eq 0 ]; then
                rm -f "$output_file"
                return 0
              fi

              if ! grep -Eqi \
                '408 Request Timeout|429 Too Many Requests|500 Internal Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|network timeout|EAI_AGAIN|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENETUNREACH|socket hang up' \
                "$output_file"; then
                rm -f "$output_file"
                return "$status"
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                rm -f "$output_file"
                return "$status"
              fi

              echo "::warning::npm audit service unavailable; retrying in ${delay}s (attempt $((attempt + 1))/${max_attempts})."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          audit_with_retry --omit=dev
          audit_with_retry

  browser:
    name: Browser, accessibility, and responsive review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run test:e2e

      - name: Preserve browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
